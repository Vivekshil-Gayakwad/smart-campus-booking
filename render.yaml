services:
  - type: web
    name: smart-campus-booking
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: campus_booking
      - key: DB_PORT
        value: 3306
      - key: DB_SSL
        value: true
