<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Register - Campus Booking</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">📚 Campus Booking</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="student-login.html">Login</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-box" style="max-width:500px;">
            <h2>Student Registration</h2>
            <div id="alert-box"></div>
            <form id="registerForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="full_name" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label>Roll Number</label>
                    <input type="text" id="roll_number" placeholder="e.g. 22BCE1234" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Enter your college email" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" placeholder="Enter 10-digit phone number" pattern="[0-9]{10}" required>
                </div>
                <div class="form-group">
                    <label>Branch</label>
                    <select id="branch" required>
                        <option value="">-- Select Branch --</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Mechanical">Mechanical</option>
                        <option value="Civil">Civil</option>
                        <option value="Electrical">Electrical</option>
                        <option value="Information Technology">Information Technology</option>
                        <option value="Chemical">Chemical</option>
                        <option value="Biotechnology">Biotechnology</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Year of Study</label>
                    <select id="year_of_study" required>
                        <option value="">-- Select Year --</option>
                        <option value="1">1st Year</option>
                        <option value="2">2nd Year</option>
                        <option value="3">3rd Year</option>
                        <option value="4">4th Year</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Section</label>
                    <select id="section">
                        <option value="">-- Select Section --</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Create a password" minlength="6" required>
                </div>
                <button type="submit" class="btn btn-navy">Create Account</button>
            </form>
            <p class="link-text">Already have an account? <a href="student-login.html">Login here</a></p>
        </div>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        const submitBtn = form.querySelector('button[type="submit"]');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('alert-box');
            alertBox.innerHTML = '';

            const body = {
                full_name: document.getElementById('full_name').value.trim(),
                roll_number: document.getElementById('roll_number').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                branch: document.getElementById('branch').value,
                year_of_study: document.getElementById('year_of_study').value,
                section: document.getElementById('section').value,
                password: document.getElementById('password').value
            };

            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating Account...';

            try {
                const res = await fetch('/api/student/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();

                if (data.success) {
                    alertBox.innerHTML = 
                        `<div class="alert alert-success">${data.message}! <a href="student-login.html">Login now</a></div>`;
                    form.reset();
                } else {
                    alertBox.innerHTML = 
                        `<div class="alert alert-error">${data.message || 'Registration failed'}</div>`;
                }
            } catch (err) {
                alertBox.innerHTML = `<div class="alert alert-error">Unable to connect to server. Please check your database settings.</div>`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
            }
        });
    </script>

</body>
</html>
