<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Register - Campus Booking</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">📚 Campus Booking</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="admin-login.html">Login</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-box" style="max-width:500px;">
            <h2>Admin Registration</h2>
            <div id="alert-box"></div>
            <form id="registerForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="full_name" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Enter admin email" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" placeholder="Enter 10-digit phone number" pattern="[0-9]{10}" required>
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="role" required>
                        <option value="">-- Select Role --</option>
                        <option value="Super Admin">Super Admin</option>
                        <option value="Admin">Admin</option>
                        <option value="Resource Manager">Resource Manager</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Create a password" minlength="6" required>
                </div>
                <button type="submit" class="btn btn-navy">Create Admin Account</button>
            </form>
            <p class="link-text">Already registered? <a href="admin-login.html">Login here</a></p>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const body = {
                full_name: document.getElementById('full_name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                role: document.getElementById('role').value,
                password: document.getElementById('password').value
            };

            const res = await fetch('/api/admin/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();

            if (data.success) {
                document.getElementById('alert-box').innerHTML = 
                    `<div class="alert alert-success">${data.message}! <a href="admin-login.html">Login now</a></div>`;
                document.getElementById('registerForm').reset();
            } else {
                document.getElementById('alert-box').innerHTML = 
                    `<div class="alert alert-error">${data.message}</div>`;
            }
        });
    </script>

</body>
</html>
