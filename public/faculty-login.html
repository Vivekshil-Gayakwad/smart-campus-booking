<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Login - Campus Booking</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">📚 Campus Booking</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="student-login.html">Student</a>
            <a href="admin-login.html">Admin</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-box">
            <h2>Faculty Login</h2>
            <div id="alert-box"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-navy">Login</button>
            </form>
            <p class="link-text">Don't have an account? <a href="faculty-register.html">Register here</a></p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const res = await fetch('/api/faculty/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();

            if (data.success) {
                localStorage.setItem('faculty', JSON.stringify(data.faculty));
                window.location.href = 'faculty-dashboard.html';
            } else {
                document.getElementById('alert-box').innerHTML = 
                    `<div class="alert alert-error">${data.message}</div>`;
            }
        });
    </script>

</body>
</html>
